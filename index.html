<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إلكِ 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
:root{--pink:#ff5f91;--deep:#c82e68;--cream:#fff8f7}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:'Cairo',system-ui,sans-serif;background:radial-gradient(circle at 15% 18%,#ffe0eb 0 8%,transparent 30%),radial-gradient(circle at 90% 85%,#ffd9e6 0 9%,transparent 33%),linear-gradient(145deg,#fff9f7,#ffeef3);color:#55233a;overflow-x:hidden}
main{min-height:100vh;display:grid;place-items:center;padding:25px;position:relative}.card{width:min(650px,100%);text-align:center;background:#ffffffd9;border:1px solid #fff;box-shadow:0 24px 70px #a83c6320;border-radius:32px;padding:clamp(28px,7vw,62px) 24px;backdrop-filter:blur(10px);position:relative;z-index:1}.eyebrow{color:#d24a79;font-weight:700;font-size:.9rem}.heart{font-size:38px;animation:pulse 1.4s infinite;display:inline-block}h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.35;margin:12px 0;color:#8b2852}p{font-size:1.12rem;line-height:1.9;margin:0 auto 26px;max-width:490px;color:#765365}.buttons{display:flex;justify-content:center;align-items:center;gap:16px;min-height:74px;position:relative}.btn{border:0;border-radius:999px;padding:13px 34px;font:700 1.05rem 'Cairo',sans-serif;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s;box-shadow:0 9px 22px #a83c6325}.yes{background:linear-gradient(135deg,#ff7aa6,#ed477f);color:white}.yes:hover{transform:translateY(-3px);box-shadow:0 14px 25px #d9447938}.no{background:#fff;color:#9a6279;border:1px solid #f2dbe4;position:relative}.hint{font-size:.88rem;color:#aa8293;margin-top:18px;min-height:28px}.floating{position:fixed;pointer-events:none;opacity:.55;animation:float 7s ease-in-out infinite;font-size:20px}.f1{top:12%;left:9%}.f2{top:72%;left:16%;animation-delay:-2s}.f3{top:20%;right:11%;animation-delay:-4s}.f4{bottom:9%;right:12%;animation-delay:-1s}
#second{display:none}.love-copy{font-size:clamp(1.2rem,4vw,1.6rem);font-weight:700;color:#8b2852}.rose{width:175px;height:190px;margin:8px auto 18px;position:relative;animation:sway 3s ease-in-out infinite;transform-origin:bottom center}.stem{position:absolute;width:7px;height:115px;background:linear-gradient(90deg,#39794d,#67aa69);left:84px;top:66px;border-radius:8px}.leaf{position:absolute;width:41px;height:21px;background:#61a86a;border-radius:100% 0 100% 0;top:122px;left:49px;transform:rotate(17deg)}.leaf.l2{left:87px;top:142px;transform:rotate(195deg)}.bloom{position:absolute;left:48px;top:9px;width:82px;height:82px;animation:open 1.8s cubic-bezier(.2,.8,.2,1) both}.petal{position:absolute;width:37px;height:50px;background:linear-gradient(145deg,#ff8eb2,#d93670);border-radius:60% 60% 45% 45%;left:23px;top:2px;transform-origin:50% 90%;box-shadow:inset 2px 2px 5px #ffc0d3}.petal:nth-child(1){transform:rotate(0deg) translateY(-11px)}.petal:nth-child(2){transform:rotate(60deg) translateY(-11px)}.petal:nth-child(3){transform:rotate(120deg) translateY(-11px)}.petal:nth-child(4){transform:rotate(180deg) translateY(-11px)}.petal:nth-child(5){transform:rotate(240deg) translateY(-11px)}.petal:nth-child(6){transform:rotate(300deg) translateY(-11px)}.center{position:absolute;left:31px;top:30px;width:22px;height:22px;background:#ffcf68;border-radius:50%;box-shadow:0 0 10px #ffdb86}.back{margin-top:10px;background:#fff0f5;color:#a53c65}
@keyframes pulse{50%{transform:scale(1.18)}}@keyframes float{50%{transform:translateY(-20px) rotate(12deg)}}@keyframes sway{50%{transform:rotate(5deg)}}@keyframes open{from{transform:scale(.15) rotate(-35deg);opacity:.1}to{transform:scale(1) rotate(0);opacity:1}}
.fullscreen-yes{position:fixed!important;inset:0!important;width:100vw;height:100vh;border-radius:0;z-index:10;font-size:clamp(3rem,15vw,9rem);padding:0;box-shadow:none!important;animation:fill .65s ease-out forwards}@keyframes fill{to{transform:scale(1.05)}}
@media(max-width:480px){.photos .buttons{gap:10px}.btn{padding:12px 27px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style></head>
<body>
<span class="floating f1">♡</span><span class="floating f2">✿</span><span class="floating f3">♡</span><span class="floating f4">✦</span>
<main><section class="card" id="first"><span class="heart">💗</span><div class="eyebrow">سؤال صغير من قلبي</div><h1>بتحبيني؟</h1><p>جاوبي بصراحة… بس قلبي حاسس إنه بيعرف الجواب 😉</p><div class="buttons"><button class="btn yes" id="yes">نعم 💖</button><button class="btn no" id="no">لا 🙈</button></div><div class="hint" id="hint"></div></section>
<section class="card" id="second"><div class="eyebrow">كنت عارف الجواب 💞</div><h1>وأنا بحبك أكتر!</h1><div class="rose" aria-label="وردة تتفتح"><div class="stem"></div><div class="leaf"></div><div class="leaf l2"></div><div class="bloom"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div></div><p class="love-copy">وجودك بحياتي أحلى صدفة، وضحكتك أحلى شي بالدنيا.<br>كل يوم معك بحبه أكتر من اللي قبله 💗</p></section></main>
<script>
const no=document.getElementById('no'), yes=document.getElementById('yes'), hint=document.getElementById('hint');let count=0;
function runAway(){count++;const area=document.querySelector('.buttons').getBoundingClientRect();const maxX=Math.max(0,area.width-no.offsetWidth),maxY=90;no.style.position='fixed';no.style.zIndex='5';no.style.left=Math.random()*Math.max(0,innerWidth-no.offsetWidth-24)+12+'px';no.style.top=Math.random()*Math.max(0,innerHeight-no.offsetHeight-24)+12+'px';const msgs=['متأكدة؟ جربي كمان مرة 😌','لسه في فرصة تغيّري رأيك 🙃','خلص، واضح إنك بتحبيني! اضغطي نعم 💖'];hint.textContent=msgs[Math.min(count-1,2)];if(count>=3){yes.classList.add('fullscreen-yes');no.style.display='none';hint.style.display='none';document.querySelector('#first h1').style.opacity='.1';document.querySelector('#first p').style.opacity='.1'}}
no.addEventListener('mouseenter',runAway);no.addEventListener('click',runAway);no.addEventListener('touchstart',e=>{e.preventDefault();runAway()},{passive:false});
yes.addEventListener('click',()=>{document.getElementById('first').style.display='none';document.getElementById('second').style.display='block';document.querySelector('main').scrollIntoView({behavior:'smooth'})});
</script></body></html>
